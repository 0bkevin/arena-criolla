name: arena-criolla-prod-tst
services:
  app:
    image: arena-criolla:prod-tst
    container_name: arena-criolla-prod-tst
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: /etc/arena-criolla-prod-tst/server.env
    environment:
      NODE_ENV: production
      ARENA_ENVIRONMENT: prod-tst
      PORT: "5173"
      ARENA_DATA_DIR: /app/data/creator
      ARENA_CREATOR_CONCURRENCY: "1"
      ARENA_CREATOR_CAPACITY: "4"
      ARENA_CREATOR_DAILY_ATTEMPTS: "10"
      ARENA_CREATOR_USER_DAILY_ATTEMPTS: "6"
    ports:
      - "127.0.0.1:35174:5173"
    volumes:
      - /var/lib/arena-criolla-prod-tst:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: "1.5"
