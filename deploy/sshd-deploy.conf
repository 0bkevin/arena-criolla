Port 2222
AddressFamily inet
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/arena-criolla-deploy-sshd.pid
AllowUsers arena-deploy
AuthorizedKeysFile /var/lib/arena-criolla-deploy-ssh/.ssh/authorized_keys
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
StrictModes yes
DisableForwarding yes
PermitTTY no
PermitUserRC no
ForceCommand /usr/local/bin/arena-receive-release
LoginGraceTime 20
MaxAuthTries 3
MaxSessions 1
MaxStartups 3:50:10
LogLevel VERBOSE
