name: arena-criolla
services:
  app:
    image: ${ARENA_IMAGE:-arena-criolla:local}
    container_name: arena-criolla
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: /etc/arena-criolla/server.env
    environment:
      NODE_ENV: production
      PORT: "5173"
      ARENA_TRUST_PROXY: "loopback,uniquelocal"
      ARENA_PUBLIC_URL: "https://arenacriolla.com"
    ports:
      - "127.0.0.1:35173:5173"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    pids_limit: 256
    mem_limit: 3g
    cpus: "2"
