name: arena-criolla
services:
  app:
    image: ${ARENA_IMAGE:-arena-criolla:local}
    container_name: arena-criolla
    build:
      context: ..
    restart: unless-stopped
    init: true
    env_file: /etc/arena-criolla/server.env
    environment:
      NODE_ENV: production
      PORT: "5173"
      ARENA_TRUST_PROXY: "loopback,uniquelocal"
      ARENA_PUBLIC_URL: "https://arena.kevinbravo.com"
      ARENA_DATA_DIR: /app/data/creator
      ARENA_CREATOR_ENABLED: "false"
      ARENA_CREATOR_CONCURRENCY: "1"
      ARENA_CREATOR_CAPACITY: "4"
      ARENA_CREATOR_DAILY_ATTEMPTS: "10"
      ARENA_CREATOR_USER_DAILY_ATTEMPTS: "6"
    ports:
      - "127.0.0.1:35173:5173"
    volumes:
      - ${ARENA_DATA_PATH:-/workspace/arena-criolla-production/data}:/app/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: "2"
