<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--font-sans, system-ui);
        color: var(--foreground, #ededf2);
        background: transparent;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 0 0 14px;
        font-size: 12px;
      }
      .toolbar span {
        color: var(--muted-foreground, #9ba3b5);
      }
      select,
      button {
        font: inherit;
        color: var(--foreground, #ededf2);
        background: var(--secondary, #232b39);
        border: 1px solid var(--border, #3c475a);
        padding: 7px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .buttons {
        display: flex;
        gap: 7px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .fighter {
        padding: 16px;
        background: var(--card, #181c24);
        border: 1px solid var(--border, #313948);
        border-radius: var(--radius, 10px);
        overflow: hidden;
        text-align: center;
        min-width: 0;
      }
      .fighter canvas {
        width: 100%;
        height: 145px;
        display: block;
        object-fit: contain;
      }
      .fighter strong {
        display: block;
        font-size: 11px;
        line-height: 1.4;
        margin-top: 9px;
        color: var(--foreground, #f4f5f8);
      }
      .fighter i {
        display: block;
        background: var(--color);
        height: 2px;
        width: 30px;
        margin: 9px auto 0;
        border-radius: 2px;
      }
      .stages {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .stage img {
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: cover;
        border-radius: 7px;
        display: block;
      }
      .stage span {
        display: block;
        font-size: 10px;
        color: var(--muted-foreground, #96a3b9);
        margin-top: 7px;
        text-align: center;
      }
      .status {
        font-size: 10px;
        color: var(--muted-foreground, #96a3b9);
        margin: 13px 0 0;
        line-height: 1.6;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--ring, #dfff7b);
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        .fighter {
          padding: 16px 8px;
        }
        .fighter canvas {
          height: 105px;
        }
        .fighter strong {
          font-size: 9px;
        }
        .grid,
        .stages {
          gap: 7px;
        }
        .toolbar {
          font-size: 10px;
        }
        .toolbar > span {
          max-width: 110px;
        }
        .buttons {
          gap: 5px;
        }
        select,
        button {
          padding: 6px 7px;
          font-size: 10px;
        }
        .stage span {
          font-size: 8px;
        }
      }
    </style>

      };
      let playing = true,
        tick = 0;
      const images = {};
      const modes = {
        idle: [0],
        run: [2, 3],
        block: [1],
        jump: [4],
        punch: [0, 5, 5, 0],
        kick: [0, 6, 6, 0],
        hurt: [7],
      };
      function draw() {
        const list = modes[document.getElementById("pose").value];
        const frame = list[Math.floor(tick / 2) % list.length];
        for (const f of fighters) {
          const im = images[f.id];
          if (!im) continue;
          const canvas = document.getElementById(f.id),
            ctx = canvas.getContext("2d"),
            source = f.frames[frame],
            scale = 320 / f.bodyHeight;
          ctx.clearRect(0, 0, 300, 360);
          ctx.drawImage(
            im,
            source.x,
            source.y,
            source.width,
            source.height,
            150 + (source.x - source.slotX - im.width / 8) * scale,
            338 +
              (source.y - source.slotY - (f.frames[0].y + f.frames[0].height)) *
                scale,
            source.width * scale,
            source.height * scale,
          );
        }
      }
      Promise.all(
        fighters.map(
          (f) =>
            new Promise((resolve, reject) => {
              const im = new Image();
              im.onload = () => {
                images[f.id] = im;
                resolve();
              };
              im.onerror = reject;
              im.src = paths[f.id];
            }),
        ),
      )
        .then(() => {
          document.getElementById("status").textContent =
            "6 luchadores · 48 poses · 3 escenarios · Ilustraciones generadas con image_gen";
          console.log("Asset preview: six sprites loaded, eight poses each.");
          draw();
        })
        .catch(() => {
          document.getElementById("status").textContent =
            "No se pudo cargar un asset.";
          console.error("Asset preview failed");
        });

        tick = 0;
        draw();
      });
      document.getElementById("play").addEventListener("click", () => {
        playing = !playing;
        document.getElementById("play").textContent = playing
          ? "Pausar"
          : "Animar";
      });
      setInterval(() => {
        if (playing) {
          tick++;
          draw();
        }
      }, 100);
