<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground,#eaf0f8);font-family:var(--font-sans,system-ui,sans-serif)}.stage{position:relative;padding:16px;border-radius:var(--radius,12px);background:#0c1729;overflow:hidden}canvas{display:block;width:100%;height:auto}.controls{display:flex;gap:14px;align-items:center;margin-top:14px}button{font:inherit;font-weight:650;background:var(--primary,#ffda68);color:var(--primary-foreground,#101828);border:0;border-radius:7px;padding:9px 15px;cursor:pointer;white-space:nowrap}input{min-width:40px;flex:1;accent-color:var(--accent,#d2aa56)}output{font-size:13px;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}.caption{font-size:14px;color:var(--muted-foreground,#a5b0c4);line-height:1.5;margin:12px 0 0}img.asset{display:none}.poster{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:auto}.poster figure{margin:0;text-align:center;color:#f6ead0;font:600 16px system-ui}.poster img{display:block;height:380px;width:100%;object-fit:contain;margin-top:12px}.poster figure:last-child img{transform:scaleX(-1)}canvas{position:absolute;inset:16px;width:calc(100% - 32px);display:none}@media(max-width:450px){.controls{gap:8px}button{padding:8px 11px}output{min-width:62px}}
</style></head><body><div class="stage"><div class="poster"><figure>Vicente Zavarce<img src="defiant-entrance-zavarce.webp" alt="Vicente standing with arms crossed"></figure><figure>Pedro Vallenilla<img src="defiant-entrance-vallenilla.webp" alt="Pedro standing with arms crossed"></figure></div><canvas width="720" height="440" aria-label="Vicente Zavarce and Pedro Vallenilla demonstrating the crossed-arms entrance"></canvas></div><div class="controls"><button id="play" type="button">Replay entrance</button><input id="seek" aria-label="Entrance progress" type="range" min="0" max="1000" value="600"><output id="phase" aria-live="polite">Arms crossed</output></div><p class="caption">The new default for 24 fighters: straighten up, fold the arms, hold the challenge, then return to guard. Vicente’s phone and Pedro’s card are gone.</p>
<img class="asset" id="zavarce-entry" src="../public/assets/zavarce-defiant-entrance.webp" alt=""><img class="asset" id="zavarce-guard" src="../public/assets/zavarce-v5.webp" alt=""><img class="asset" id="vallenilla-entry" src="../public/assets/vallenilla-defiant-entrance.webp" alt=""><img class="asset" id="vallenilla-guard" src="../public/assets/vallenilla-v5.webp" alt="">
<script>
const fighters=[{"id":"zavarce","name":"Vicente Zavarce","entrance":{"file":"zavarce-defiant-entrance","cell":512,"bodyHeight":400,"baseline":492,"anchorX":256,"width":1536,"height":1024,"frames":[{"x":131,"y":90,"width":265,"height":405,"slotX":0,"slotY":0},{"x":647,"y":89,"width":253,"height":406,"slotX":512,"slotY":0},{"x":1153,"y":89,"width":268,"height":406,"slotX":1024,"slotY":0},{"x":127,"y":601,"width":271,"height":406,"slotX":0,"slotY":512},{"x":638,"y":602,"width":273,"height":405,"slotX":512,"slotY":512},{"x":1150,"y":601,"width":271,"height":406,"slotX":1024,"slotY":512}]},"combat":{"file":"zavarce-v5","frame":{"x":53,"y":10,"width":312,"height":427},"cellWidth":443.5,"bodyHeight":426}},{"id":"vallenilla","name":"Pedro Vallenilla","entrance":{"file":"vallenilla-defiant-entrance","cell":512,"bodyHeight":400,"baseline":492,"anchorX":256,"width":1536,"height":1024,"frames":[{"x":128,"y":89,"width":265,"height":406,"slotX":0,"slotY":0},{"x":645,"y":89,"width":253,"height":406,"slotX":512,"slotY":0},{"x":1153,"y":89,"width":262,"height":406,"slotX":1024,"slotY":0},{"x":125,"y":601,"width":271,"height":406,"slotX":0,"slotY":512},{"x":637,"y":600,"width":265,"height":407,"slotX":512,"slotY":512},{"x":1151,"y":601,"width":267,"height":406,"slotX":1024,"slotY":512}]},"combat":{"file":"vallenilla-v5","frame":{"x":59,"y":9,"width":319,"height":444},"cellWidth":443.5,"bodyHeight":443}}];
const keys=[[0,0],[.09,1],[.23,2],[.32,3],[.4,4],[.48,5],[.76,4],[.8,3],[.84,2],[.87,0]];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek'),phase=document.querySelector('#phase'),button=document.querySelector('#play');let running=false,start=0;
function draw(t){ctx.clearRect(0,0,720,440);ctx.imageSmoothingEnabled=false;
 fighters.forEach((f,i)=>{ctx.save();ctx.beginPath();ctx.rect(i*360,0,360,440);ctx.clip();const gradient=ctx.createRadialGradient(i*360+180,150,0,i*360+180,180,330);gradient.addColorStop(0,i?'#444c30':'#343359');gradient.addColorStop(1,'#101a2b');ctx.fillStyle=gradient;ctx.fillRect(i*360,0,360,440);ctx.translate(i*360+180,419);ctx.scale(i?-1:1,1);let image,frame,scale,left,top;if(t<=0||t>=.9){const a=f.combat;image=document.getElementById(f.id+'-guard');frame=a.frame;scale=390/a.bodyHeight;left=(frame.x-a.cellWidth/2)*scale;top=-frame.height*scale;}else{const a=f.entrance;image=document.getElementById(f.id+'-entry');const key=keys.filter(k=>k[0]<=t).at(-1);frame=a.frames[key[1]];scale=390/a.bodyHeight;left=(frame.x-frame.slotX-a.anchorX)*scale;top=(frame.y-frame.slotY-a.baseline)*scale;}if(image.complete&&image.naturalWidth)ctx.drawImage(image,frame.x,frame.y,frame.width,frame.height,left,top,frame.width*scale,frame.height*scale);ctx.restore();ctx.fillStyle='#f6ead0';ctx.font='600 18px system-ui';ctx.textAlign='center';ctx.fillText(f.name,i*360+180,24);});
phase.value=t>=.9||t<=0?'Guard':t<.23?'Stand tall':t<.48?'Fold arms':t<.76?'Arms crossed':'Release';}
function frame(now){if(!running)return;const t=Math.min(1,(now-start)/2800);seek.value=t*1000;draw(t);if(t<1)requestAnimationFrame(frame);else{running=false;button.textContent='Replay entrance';}}
button.onclick=()=>{running=true;start=performance.now();button.textContent='Playing…';requestAnimationFrame(frame);};seek.oninput=()=>{running=false;button.textContent='Replay entrance';draw(seek.value/1000);};Promise.all([...document.querySelectorAll('img.asset')].map(i=>i.decode())).then(()=>{document.querySelector('.poster').style.visibility='hidden';canvas.style.display='block';draw(.6);console.log('Loaded both six-frame entrance atlases and original guards.');}).catch(console.error);
</script></body></html>
