<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#e7edf5)}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;padding:16px;border-radius:var(--radius,12px);background:var(--card,#142235);min-width:0}h3{font-size:14px;margin:0 0 12px;font-weight:650}
.picture{height:240px;background:#18273a;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}.picture img,.picture canvas{width:100%;height:100%;object-fit:contain}.picture .reference{object-fit:cover;transform:scaleX(-1)}p{font-size:12px;line-height:1.5;margin:10px 0 0;color:var(--muted-foreground,#a8b3c3)}a{color:var(--foreground,#e7edf5);text-underline-offset:3px}.new h3{color:var(--accent-foreground,#ffd966)}
@media(max-width:510px){.compare{grid-template-columns:1fr}.picture{height:270px}.picture img,.picture canvas{width:auto;max-width:100%}}
</style></head><body>
<div class="compare">
<figure><h3>Fotografía de referencia</h3><div class="picture"><img class="reference" src="/home/ubuntu/.t3/projects/vepol/assets/references/capriles/likeness-v22/tricolor-closeup-2012.jpg" alt="Henrique Capriles en fotografía real con gorra tricolor"></div><p><a href="https://commons.wikimedia.org/wiki/File:Henrique_Capriles_Radonski_2.jpg" target="_blank" rel="noreferrer">Wilfredor · 2012 · CC0</a><br>Invertida para comparar la misma orientación.</p></figure>
<figure><h3>Rostro anterior</h3><div class="picture"><canvas id="previous" width="300" height="360" aria-label="Rostro anterior del juego"></canvas></div><p>La versión que señalaste.</p></figure>
<figure class="new"><h3>Rostro actualizado</h3><div class="picture"><canvas id="updated" width="300" height="360" aria-label="Nuevo rostro de Capriles integrado en el juego"></canvas></div><p>Rostro más natural, con mayor detalle facial.</p></figure>
</div>
<script>
const sprites=[
 {id:'previous',src:'/home/ubuntu/.t3/projects/vepol/public/assets/capriles-v21.webp',frame:{minX:58,minY:8,maxX:377,maxY:435}},
 {id:'updated',src:'/home/ubuntu/.t3/projects/vepol/public/assets/capriles-v22.webp',frame:{minX:181,minY:58,maxX:585,maxY:737}}
];
Promise.all(sprites.map(s=>new Promise((resolve,reject)=>{
 const img=new Image();img.onerror=()=>reject(Error('Image failed: '+s.id));img.onload=()=>{
  const f=s.frame,h=f.maxY-f.minY+1,w=f.maxX-f.minX+1;
  const scratch=document.createElement('canvas');scratch.width=w;scratch.height=Math.ceil(h*.23);
  const sc=scratch.getContext('2d',{willReadFrequently:true});sc.drawImage(img,f.minX,f.minY,w,scratch.height,0,0,w,scratch.height);
  const bytes=sc.getImageData(0,0,w,scratch.height).data;let mass=0,weighted=0;
  for(let p=0;p<bytes.length/4;p++){const a=bytes[p*4+3];if(a<40)continue;mass+=a;weighted+=(p%w)*a;}
  const center=f.minX+weighted/mass,cropHeight=h*.35,cropWidth=cropHeight*300/360;
  const ctx=document.getElementById(s.id).getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,center-cropWidth/2,f.minY,cropWidth,cropHeight,0,0,300,360);
  resolve(s.id);
 };img.src=s.src;
}))).then(ids=>console.log('Comparison loaded: '+ids.join(', '))).catch(e=>console.error(e));
</script></body></html>
