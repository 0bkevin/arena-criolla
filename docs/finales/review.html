<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena Criolla · Coreografía y finales</title>
<style>
*{box-sizing:border-box}html,body{background:transparent}body{margin:0;color:var(--foreground,#e7e9ed);font:15px/1.5 var(--font-sans,system-ui,sans-serif)}
.tabs{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--border,#394154);border-radius:8px;padding:8px 14px;background:var(--secondary,#212630);color:var(--foreground,#e7e9ed)}button[aria-selected=true]{background:#f0c972;color:#201a10;border-color:#f0c972}button:focus-visible,a:focus-visible{outline:2px solid var(--ring,#f0c972);outline-offset:3px}
.panel{margin:0}.panel[hidden]{display:none}img{display:block;width:100%;height:auto;border-radius:10px;background:#080d15}figcaption{margin:9px 0 0;color:var(--muted-foreground,#9da8b9);font-size:14px}a{color:var(--foreground,#e7e9ed);text-underline-offset:3px}.playback{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--muted-foreground,#9da8b9)}.playback button{padding:5px 10px;font-size:12px}
</style></head><body>
<p style="margin:0 0 12px">La versión actual conserva la arena, la cámara y el HUD. <a href="videos/nacho-y-capriles-en-arena-2026-10-19.mp4">Ver la nueva grabación de Nacho y Capriles en combate</a>. Las imágenes de esta página documentan el montaje anterior.</p>
<div class="tabs" role="tablist" aria-label="Escenas anteriores">
<button role="tab" id="tab-dance" aria-controls="dance" aria-selected="true">Perro Mujeriego</button>
<button role="tab" id="tab-hack" aria-controls="hack" aria-selected="false" tabindex="-1">Giuseppe</button>
<button role="tab" id="tab-cafe" aria-controls="cafe" aria-selected="false" tabindex="-1">Capriles</button>
</div>
<p style="margin:0 0 12px;color:var(--muted-foreground,#9da8b9);font-size:13px">46 personajes · 368 poses nuevas · ambos bailan</p>
<figure class="panel" id="dance" role="tabpanel" aria-labelledby="tab-dance"><img id="dance-animation" src="videos/nacho-capriles-perro-mujeriego-v3-preview.webp" width="728" height="432" alt="Grabación del juego: Nacho y Capriles se tapan la cara, hacen patitas a ambos lados, un barrido de brazo y un corazón con las manos, siguiendo juntos la coreografía"><figcaption>Los dos siguen los ocho gestos del <a href="https://www.youtube.com/shorts/Td2Zs5kiH0Y" target="_blank" rel="noreferrer">Short de Nacho</a>, en el tramo 34,1–40,1 s. Cada personaje conserva sus dibujos y su vestuario.</figcaption><div class="playback"><button id="play-pause" type="button" aria-pressed="false">Pausar animación</button><span>Grabación histórica sin audio. Actualmente: música original a volumen bajo; canción descartada.</span></div></figure>
<figure class="panel" id="hack" role="tabpanel" aria-labelledby="tab-hack" hidden><img src="screenshots/giuseppe-hack.png" alt="Giuseppe teclea en una mesa pequeña; la pantalla del portátil mira hacia él y la tapa queda hacia el rival"><figcaption>La mesa tiene una escala proporcionada y la pantalla del portátil mira hacia Giuseppe.</figcaption></figure>
<figure class="panel" id="cafe" role="tabpanel" aria-labelledby="tab-cafe" hidden><img src="screenshots/capriles-cafe.png" alt="Capriles toma café frente a Nacho; ambos están sentados en sus sillas junto a la mesa"><figcaption>Los 46 personajes tienen su dibujo sentado para conversar y tomar café con Capriles.</figcaption></figure>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];function select(tab){for(const t of tabs){const active=t===tab;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!active;}}tabs.forEach((tab,i)=>{tab.onclick=()=>select(tab);tab.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;select(tabs[next]);tabs[next].focus();};});
const animation=document.getElementById('dance-animation'),toggle=document.getElementById('play-pause');
const motion='videos/nacho-capriles-perro-mujeriego-v3-preview.webp',still='screenshots/nacho-capriles-v3-heart.png';
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
function playback(){animation.src=paused?still:motion;toggle.textContent=paused?'Reproducir animación':'Pausar animación';toggle.setAttribute('aria-pressed',String(paused));}
toggle.onclick=()=>{paused=!paused;playback();};playback();
console.log('3 escenas listas; animación real de seis segundos, pausa y navegación por teclado');
</script></body></html>
