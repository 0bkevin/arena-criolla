<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.45 var(--font-sans,system-ui);color:var(--foreground,#e9edf5)}p{margin:0 0 12px}strong{font-size:19px} .muted{color:var(--muted-foreground,#9aa8bc)}.controls{display:flex;gap:10px;align-items:end;margin:16px 0 12px;flex-wrap:wrap}label{display:grid;gap:5px;flex:1;min-width:200px;font-size:13px}select,button{font:inherit;border:1px solid var(--border,#455063);border-radius:8px;padding:9px 12px;background:var(--card,#182231);color:var(--foreground,#e9edf5)}button{cursor:pointer;font-weight:650;min-width:130px;background:var(--primary,#ffe19b);color:var(--primary-foreground,#181f2d)}select:focus-visible,button:focus-visible{outline:2px solid var(--ring,#f3cf78);outline-offset:3px}figure{margin:0}img{display:block;width:100%;height:auto;aspect-ratio:640/355;border-radius:10px}figcaption{margin-top:9px;font-size:13px}.note{margin:12px 0 0;font-size:13px} @media(max-width:440px){.controls{align-items:stretch}button{width:100%}}
</style></head><body><p><strong>Refreshed finale artwork</strong><br><span class="muted">Capriles · Nacho · Javier Hala Madrid · Doctor Knoche</span></p><p>40 new illustrated poses matching the current designs from main.</p><div class="controls"><label for="scene">Attack preview<select id="scene"></select></label><button id="play" aria-pressed="false">Play attack</button></div><figure><img id="preview" alt="Updated Capriles and Nacho seated at the café table inside the fighting arena"><figcaption id="caption" class="muted" aria-live="polite"></figcaption></figure><p class="note muted">Captured from the game renderer. Café guests and both dancers use the refreshed artwork in the same arena. Silent previews.</p><script>
const scenes=[{"id": "capriles-nacho", "label": "Capriles + Nacho", "caption": "Cafecito interminable \u00b7 updated seated Nacho", "seconds": 3, "still": "clips/capriles-nacho-still.webp", "motion": "clips/capriles-nacho.webp"}, {"id": "capriles-javier", "label": "Capriles + Javier", "caption": "Cafecito interminable \u00b7 updated seated Javier", "seconds": 3, "still": "clips/capriles-javier-still.webp", "motion": "clips/capriles-javier.webp"}, {"id": "capriles-knoche", "label": "Capriles + Knoche", "caption": "Cafecito interminable \u00b7 updated seated Knoche", "seconds": 3, "still": "clips/capriles-knoche-still.webp", "motion": "clips/capriles-knoche.webp"}, {"id": "nacho-capriles", "label": "Nacho + Capriles", "caption": "Perro Mujeriego \u00b7 both characters follow the dance", "seconds": 6, "still": "clips/nacho-capriles-still.webp", "motion": "clips/nacho-capriles.webp"}, {"id": "nacho-javier", "label": "Nacho + Javier", "caption": "Perro Mujeriego \u00b7 both characters follow the dance", "seconds": 6, "still": "clips/nacho-javier-still.webp", "motion": "clips/nacho-javier.webp"}, {"id": "nacho-knoche", "label": "Nacho + Knoche", "caption": "Perro Mujeriego \u00b7 both characters follow the dance", "seconds": 6, "still": "clips/nacho-knoche-still.webp", "motion": "clips/nacho-knoche.webp"}, {"id": "javier-capriles", "label": "Javier\u2019s final attack", "caption": "Final de Champions \u00b7 Javier v43 and Capriles v39", "seconds": 3, "still": "clips/javier-capriles-still.webp", "motion": "clips/javier-capriles.webp"}, {"id": "knoche-javier", "label": "Knoche\u2019s final attack", "caption": "La f\u00f3rmula de Galip\u00e1n \u00b7 Knoche v46 and Javier v43", "seconds": 3, "still": "clips/knoche-javier-still.webp", "motion": "clips/knoche-javier.webp"}];const select=document.getElementById('scene'),picture=document.getElementById('preview'),button=document.getElementById('play'),caption=document.getElementById('caption');let playing=false;scenes.forEach((s,i)=>select.add(new Option(s.label,String(i))));function show(){const s=scenes[Number(select.value)];picture.src=playing?s.motion:s.still;picture.alt=s.caption;caption.textContent=s.caption+' · '+s.seconds+' seconds';button.textContent=playing?'Pause preview':'Play attack';button.setAttribute('aria-pressed',String(playing));}select.onchange=show;button.onclick=()=>{playing=!playing;show()};show();
</script></body></html>
