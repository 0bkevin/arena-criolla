<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Javier Hala Madrid · referencia elegida</title><style>*{box-sizing:border-box}body{margin:0;font:14px var(--font-sans,system-ui);color:var(--foreground,#f6f2e4)}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}strong{font-size:17px}select{font:inherit;padding:9px 12px;color:inherit;background:var(--secondary,#192538);border:1px solid var(--border,#3b4d61);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figcaption{font-size:12px;color:var(--muted-foreground,#afbdce);margin-bottom:8px}.art{aspect-ratio:1;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at bottom,#2a3c50,#101a29)}canvas{display:block;width:100%;height:100%}p{line-height:1.5;margin:12px 0 7px}small{display:block;font-size:12px;color:var(--muted-foreground,#afbdce);line-height:1.5}details{margin-top:14px}summary{cursor:pointer;font-size:13px;color:var(--accent,#b3c9f8)}details img{display:block;width:100%;height:auto;border-radius:10px;margin-top:12px}#status{color:var(--muted-foreground,#afbdce);font-size:12px;margin-top:12px}@media(max-width:450px){header{gap:9px}strong{font-size:15px}.grid{gap:7px}figcaption{font-size:10px}select{font-size:12px;padding:8px}}</style><header><strong>Javier Hala Madrid</strong><select id="pose" aria-label="Movimiento"><option value="0">Guardia</option><option value="1">Bloqueo</option><option value="2">Carrera A</option><option value="3">Carrera B</option><option value="4">Salto</option><option value="5">Golpe</option><option value="6">Patada</option><option value="7">Impacto</option><option value="8">Presentación</option></select></header><main class="grid"><figure><figcaption>Tu referencia</figcaption><div class="art"><canvas id="ref" width="300" height="300" aria-label="Rostro de la fotografía que enviaste"></canvas></div></figure><figure><figcaption>Anterior · v42</figcaption><div class="art"><canvas id="old" width="300" height="300" aria-label="Cara anterior"></canvas></div></figure><figure><figcaption>Nueva · v43</figcaption><div class="art"><canvas id="new" width="300" height="300" aria-label="Nuevo rostro basado en tu fotografía"></canvas></div></figure></main><p>Sin barba, copete alto, sonrisa amplia y cejas expresivas, siguiendo la foto que elegiste.</p><small>La misma apariencia en combate, selección y presentación. Puedes cambiar de movimiento para revisar cada pose.</small><div id="status" role="status">Cargando los assets…</div><details><summary>Ver en la cinemática del juego</summary><img src="cinematic.png" alt="Javier con su nuevo rostro durante la cinemática del juego"></details><script>const data={"reference":"../../assets/source/identity-v43/user-reference.png","old":"../../public/assets/javier-v42.webp","current":"../../public/assets/javier-v43.webp","oldIntro":"../../public/assets/javier-v42-defiant-entrance.webp","currentIntro":"../../public/assets/javier-v43-defiant-entrance.webp","oldFrame":{"x":665,"y":553,"width":207,"height":440,"slotX":512,"slotY":512},"currentFrame":{"x":676,"y":555,"width":184,"height":438,"slotX":512,"slotY":512}};const cache=new Map();let token=0;function img(src){if(!cache.has(src))cache.set(src,new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=src}));return cache.get(src)}function bounds(image,frame){const c=document.createElement('canvas');c.width=512;c.height=512;const t=c.getContext('2d',{willReadFrequently:true});t.drawImage(image,(frame%4)*512,Math.floor(frame/4)*512,512,512,0,0,512,512);const d=t.getImageData(0,0,512,512).data;let x=512,y=512,mx=0,my=0;for(let n=0;n<512*512;n++){if(d[n*4+3]<40)continue;const xx=n%512,yy=Math.floor(n/512);x=Math.min(x,xx);y=Math.min(y,yy);mx=Math.max(mx,xx);my=Math.max(my,yy)}return{x:x+(frame%4)*512,y:y+Math.floor(frame/4)*512,width:mx-x+1,height:my-y+1}}function crop(canvas,image,b,flip){const tmp=document.createElement('canvas');tmp.width=b.width;tmp.height=Math.max(1,Math.floor(b.height*.12));const t=tmp.getContext('2d',{willReadFrequently:true});t.drawImage(image,b.x,b.y,b.width,tmp.height,0,0,b.width,tmp.height);const d=t.getImageData(0,0,tmp.width,tmp.height).data;let w=0,sum=0;for(let n=0;n<tmp.width*tmp.height;n++){const a=d[n*4+3];if(a>=40){w+=a;sum+=a*(n%tmp.width)}}const center=b.x+(w?sum/w:b.width/2),size=b.height*.325;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,300,300);ctx.save();if(flip){ctx.translate(300,0);ctx.scale(-1,1)}ctx.drawImage(image,center-size/2,b.y-6,size,size,0,0,300,300);ctx.restore()}async function paint(){const n=++token,pose=Number(document.getElementById('pose').value),intro=pose===8;try{const [photo,old,now]=await Promise.all([img(data.reference),img(intro?data.oldIntro:data.old),img(intro?data.currentIntro:data.current)]);if(n!==token)return;const r=document.getElementById('ref').getContext('2d');r.clearRect(0,0,300,300);r.drawImage(photo,200,0,400,400,0,0,300,300);crop(document.getElementById('old'),old,intro?data.oldFrame:bounds(old,pose),false);crop(document.getElementById('new'),now,intro?data.currentFrame:bounds(now,pose),pose===7);document.getElementById('status').textContent='Assets de producción · rostro revisado contra tu referencia.'}catch(e){document.getElementById('status').textContent='Error al cargar la comparación';console.error(e)}}document.getElementById('pose').onchange=paint;paint();</script></html>
