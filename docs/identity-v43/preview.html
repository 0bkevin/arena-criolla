<!doctype html>
<html lang="es">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Javier Hala Madrid v43 — revisión de sprites</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #0b1422;
      color: #fff5dd;
      font:
        14px system-ui,
        sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 auto 0 0;
    }
    button,
    select {
      background: #1b2a40;
      color: inherit;
      border: 1px solid #4a5b73;
      border-radius: 7px;
      padding: 8px;
      font: inherit;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
    }
    article {
      min-width: 0;
      border: 1px solid #334057;
      border-top: 3px solid var(--color);
      background: radial-gradient(ellipse at bottom, #20334b, #101c2b 75%);
      border-radius: 10px;
      padding: 12px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 250px;
      object-fit: contain;
    }
    h2 {
      font-size: 17px;
      margin: 6px 0;
    }
    .special {
      color: var(--color);
      font-size: 12px;
    }
    #result {
      color: #b2c4d9;
      font-size: 12px;
      margin: 14px 0 0;
    }
    #sheet {
      display: none;
      width: 100%;
      height: auto;
      margin-top: 16px;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .grid {
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 10px;
      }
      canvas {
        height: 210px;
      }
      h2 {
        font-size: 14px;
      }
    }
  </style>
  <header>
    <h1>Javier Hala Madrid v43</h1>
    <select id="pose" aria-label="Pose">
      <option value="0">Guardia</option>
      <option value="1">Bloqueo</option>
      <option value="2">Carrera A</option>
      <option value="3">Carrera B</option>
      <option value="4">Salto</option>
      <option value="5">Golpe</option>
      <option value="6">Patada</option>
      <option value="7">Impacto</option></select
    ><button id="flip">Cambiar lado</button
    ><button id="intro">Presentación</button
    ><button id="all">Todas las poses</button>
  </header>
  <main class="grid" id="roster"></main>
  <p id="result">Cargando y revisando los renderizadores del juego…</p>
  <canvas id="sheet"></canvas>
  <script type="module">
    import {
      reviewIdentityV43,
      reviewed,
    } from "/scripts/review-identity-v43-browser.js";
    try {
      const qa = await reviewIdentityV43();
      let facing = 1,
        active = 0;
      const actors = reviewed.map((id) => {
        const f = qa.fighterById(id),
          article = document.createElement("article");
        article.style.setProperty("--color", f.color);
        article.innerHTML = `<canvas width="520" height="560" aria-label="${f.name}"></canvas><h2>${f.name}</h2><span class="special">${f.special}</span>`;
        document.getElementById("roster").append(article);
        return { id, canvas: article.querySelector("canvas") };
      });
      function paint(progress) {
        for (const { id, canvas } of actors) {
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, 520, 560);
          if (progress === undefined)
            qa.drawSprite(
              ctx,
              qa.assets.sprites[id],
              Number(document.getElementById("pose").value),
              260,
              485,
              355,
              facing,
            );
          else
            qa.drawPresentation(
              ctx,
              qa.assets.sprites[id],
              id,
              progress,
              260,
              485,
              355,
              facing,
              "intro",
            );
        }
      }
      paint();
      document.getElementById("pose").onchange = () => {
        active++;
        paint();
      };
      document.getElementById("flip").onclick = () => {
        active++;
        facing *= -1;
        paint();
      };
      document.getElementById("intro").onclick = () => {
        const token = ++active,
          start = performance.now();
        function frame(now) {
          if (token !== active) return;
          const p = Math.min(1, (now - start) / 2800);
          paint(p);
          if (p < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      };
      document.getElementById("all").onclick = () => {
        const c = document.getElementById("sheet");
        c.width = 1280;
        c.height = (reviewed.length + 2) * 170;
        c.style.display = "block";
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#0b1422";
        ctx.fillRect(0, 0, c.width, c.height);
        const ids = ["renny", "zavarce", ...reviewed];
        ids.forEach((id, row) => {
          ctx.fillStyle = "#fff5dd";
          ctx.font = "bold 13px system-ui";
          ctx.fillText(qa.fighterById(id).name, 12, row * 170 + 18);
          for (let frame = 0; frame < 8; frame++)
            qa.drawSprite(
              ctx,
              qa.assets.sprites[id],
              frame,
              frame * 160 + 80,
              row * 170 + 163,
              130,
              1,
            );
        });
      };
      document.getElementById("result").textContent =
        `${qa.results.poses.passed}/${qa.results.poses.checked} poses · ${qa.results.entrances.passed}/${qa.results.entrances.checked} presentaciones · ${qa.results.cinematics.length} cinemáticas · ${qa.results.victories.length} celebraciones sin errores de renderizado.`;
      window.__identityV43.actors = actors;
      window.__identityV43.paint = paint;
    } catch (error) {
      document.getElementById("result").textContent = error.message;
      console.error(error);
    }
  </script>
</html>
