<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fundadores — Arena Criolla</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--background, #0b111a); color: var(--foreground, #eaf0ff); font: 14px var(--font-sans, system-ui), sans-serif; }
      .tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      label { color: var(--muted-foreground, #a8b2c6); font-size: 12px; }
      select, button { border: 1px solid var(--border, #35435a); background: var(--card, #182338); color: inherit; border-radius: 7px; padding: 8px 10px; font: inherit; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
      article { grid-column: span 2; min-width: 0; border: 1px solid var(--border, #35435a); border-top: 3px solid var(--color); border-radius: 12px; padding: 16px; background: var(--card, #111b2d); }
      article:nth-last-child(-n+2) { grid-column: span 3; }
      canvas { display: block; width: 100%; height: 210px; object-fit: contain; background: radial-gradient(ellipse at 50% 85%, color-mix(in srgb, var(--color) 15%, transparent), transparent 70%); }
      h2 { margin: 12px 0 5px; font-size: 15px; line-height: 1.25; }
      .company { color: var(--color); font-size: 12px; font-weight: 700; }
      .special { margin: 9px 0 12px; color: var(--muted-foreground, #a8b2c6); font-size: 11px; }
      details { color: var(--muted-foreground, #a8b2c6); font-size: 11px; }
      summary { cursor: pointer; }
      a { display: block; color: inherit; margin-top: 7px; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      footer { margin-top: 12px; color: var(--muted-foreground, #a8b2c6); font-size: 11px; line-height: 1.5; }
      @media(max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } article, article:nth-last-child(-n+2) { grid-column: auto; } article:last-child { grid-column: span 2; } h2 { font-size: 14px; } }
    </style>
  </head>
  <body>
    <div class="tools">
      <label for="pose">Explorar las poses</label>
      <select id="pose">
        <option value="0">Listo</option><option value="1">Bloqueo</option>
        <option value="2">Carrera · 1</option><option value="3">Carrera · 2</option>
        <option value="4">Salto</option><option value="5">Puño</option>
        <option value="6">Patada</option><option value="7">Reacción</option>
      </select>
      <button id="facing" type="button">Cambiar orientación</button>
    </div>
    <div class="grid" id="roster"></div>
    <footer>Cinco personas, seis empresas: Juan José Pocaterra representa a Vikua y La Wawa. Ocho poses por personaje, con entradas, especiales y celebraciones propias. Las acciones son ficción del juego.</footer>
    <script id="character-data" type="application/json">[{"id":"enrique","name":"Enrique Rivas","company":"Fina","color":"#b59bff","special":"Balance en cadena","sources":["https://www.finapartner.com/nuestra-historia/","https://es.linkedin.com/posts/enriquerivasz_venezuelastartupsummit-activity-7252886615197462529-fdwF","https://es.linkedin.com/posts/enriquerivasz_el-otro-d%C3%ADa-estaba-en-un-podcast-y-me-preguntaron-activity-7371731396769533952-zpyC"]},{"id":"jesus","name":"Jesús Castillo","company":"Kontigo","color":"#ff9b54","special":"Transferencia de vuelta","sources":["https://www.kontigo.com/quienes-somos","https://elestimulo.com/elinteres/empresas/2026-04-17/la-ambicion-de-kontigo/","https://elestimulo.com/elinteres/empresas/2026-04-17/la-ambicion-de-kontigo/"]},{"id":"carlos","name":"Carlos García Ottati","company":"Kavak","color":"#76b9ff","special":"Arranque de motor","sources":["https://www.kavak.com/ar/empleos","https://www.bloomberglinea.com/2022/12/16/ceo-de-kavak-regresa-a-dirigir-la-startup-en-mexico-tras-despido-de-country-manager/","https://www.forbes.com/sites/forbesinternational/2022/07/23/how-this-mexico-based-used-car-seller-became-the-most-valuable-startup-in-latin-america/"]},{"id":"victor","name":"Víctor Cárdenas","company":"Slash","color":"#ffab87","special":"Corte de saldo","sources":["https://www.slash.com/company/about","https://www.slash.com/products/global-usd","https://www.coindesk.com/business/2025/08/05/u-s-neobank-slash-debuts-stablecoin-with-stripe-s-bridge-for-global-business-payments/"]},{"id":"juan","name":"Juan José Pocaterra","company":"Vikua · La Wawa","color":"#78d7ce","special":"Red de ciudad","sources":["https://www.linkedin.com/in/juanpocaterra/","https://noticias.com.ve/ingenio-venezolano/vikua-ciudades-inteligentes-creadas-por-venezolanos/","https://www.linkedin.com/posts/lawawa_mobility-latamtech-culturalshift-activity-7448474913939689473-YByM"]}]</script>
    <script type="module">
      import { loadSprite, drawSprite } from "/src/game/assets.ts";
      const characters = JSON.parse(document.getElementById("character-data").textContent);
      let facing = 1;
      const actors = characters.map((character) => {
        const card = document.createElement("article");
        card.style.setProperty("--color", character.color);
        card.innerHTML = `<canvas width="400" height="440" aria-label="Poses de ${character.name}"></canvas><h2>${character.name}</h2><div class="company">${character.company}</div><div class="special">${character.special}</div><details><summary>Referencias de identidad</summary>${character.sources.map((source,i) => `<a href="${source}" target="_blank" rel="noreferrer">Fuente ${i+1} ↗</a>`).join("")}</details>`;
        document.getElementById("roster").append(card);
        return { character, asset: null, canvas: card.querySelector("canvas") };
      });
      function paint(actor) {
        if (!actor.asset) return;
        const ctx = actor.canvas.getContext("2d");
        const index = Number(document.getElementById("pose").value);
        ctx.clearRect(0, 0, actor.canvas.width, actor.canvas.height);
        drawSprite(ctx, actor.asset, index, 200, 412, 355, facing);
        actor.canvas.dataset.frame = String(index);
        actor.canvas.dataset.facing = String(facing);
      }
      const ready = Promise.all(actors.map(async (actor) => {
        actor.asset = await loadSprite(actor.character.id);
        paint(actor);
      }));
      ready.catch((error) => {
        document.querySelector("footer").textContent = `No se pudo cargar el elenco: ${error.message}`;
        console.error(error);
      });
      document.getElementById("pose").onchange = () => actors.forEach(paint);
      document.getElementById("facing").onclick = () => { facing *= -1; actors.forEach(paint); };
      // Expose only this development gallery's loaded actors for visual audits.
      window.__founderPreview = { actors, ready, paint };
    </script>
  </body>
</html>
