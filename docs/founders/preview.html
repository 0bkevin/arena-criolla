<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fundadores — Arena Criolla</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--foreground, #eaf0ff); font: 14px var(--font-sans, system-ui), sans-serif; }
      .tools { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      label { color: var(--muted-foreground, #a8b2c6); font-size: 12px; }
      select, button { border: 1px solid var(--border, #35435a); background: var(--card, #182338); color: inherit; border-radius: 7px; padding: 8px 10px; font: inherit; cursor: pointer; }
      .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
      article { grid-column: span 2; min-width: 0; border: 1px solid var(--border, #35435a); border-top: 3px solid var(--color); border-radius: 12px; padding: 16px; background: var(--card, #111b2d); }
      article:nth-last-child(-n+2) { grid-column: span 3; }
      canvas { display: block; width: 100%; height: 210px; object-fit: contain; background: radial-gradient(ellipse at 50% 85%, color-mix(in srgb, var(--color) 15%, transparent), transparent 70%); }
      h2 { margin: 12px 0 5px; font-size: 15px; line-height: 1.25; }
      .company { color: var(--color); font-size: 12px; font-weight: 700; }
      .special { margin: 9px 0 12px; color: var(--muted-foreground, #a8b2c6); font-size: 11px; }
      details { color: var(--muted-foreground, #a8b2c6); font-size: 11px; }
      summary { cursor: pointer; }
      a { display: block; color: inherit; margin-top: 7px; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      footer { margin-top: 12px; color: var(--muted-foreground, #a8b2c6); font-size: 11px; line-height: 1.5; }
      @media(max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } article, article:nth-last-child(-n+2) { grid-column: auto; } article:last-child { grid-column: span 2; } h2 { font-size: 14px; } }
    </style>
  </head>
  <body>
    <div class="tools">
      <label for="pose">Explorar las poses</label>
      <select id="pose">
        <option value="0">Listo</option><option value="1">Bloqueo</option>
        <option value="2">Carrera · 1</option><option value="3">Carrera · 2</option>
        <option value="4">Salto</option><option value="5">Puño</option>
        <option value="6">Patada</option><option value="7">Reacción</option>
      </select>
      <button id="facing" type="button">Cambiar orientación</button>
    </div>
    <div class="grid" id="roster"></div>
    <footer>Cinco personas, seis empresas: Juan José Pocaterra representa a Vikua y La Wawa. Ocho poses por personaje, con entradas, especiales y celebraciones propias. Las acciones son ficción del juego.</footer>

    <script>
      const characters = JSON.parse(document.getElementById("character-data").textContent);
      let facing = 1;
      const actors = characters.map((character) => {
        const card = document.createElement("article");
        card.style.setProperty("--color", character.color);
        card.innerHTML = `<canvas width="400" height="440" aria-label="Poses de ${character.name}"></canvas><h2>${character.name}</h2><div class="company">${character.company}</div><div class="special">${character.special}</div><details><summary>3 fotos de referencia revisadas</summary>${character.sources.map((source,i) => `<a href="${source}" target="_blank" rel="noreferrer">Fuente de la foto ${i+1} ↗</a>`).join("")}</details>`;
        document.getElementById("roster").append(card);
        const image = new Image();
        const actor = { character, image, canvas: card.querySelector("canvas") };
        image.onload = () => paint(actor);
        image.onerror = () => console.error("No se pudo cargar " + character.name);
        image.src = character.image;
        return actor;
      });
      function paint({ character, image, canvas }) {
        if (!image.complete || !image.naturalWidth) return;
        const ctx = canvas.getContext("2d");
        const index = Number(document.getElementById("pose").value);
        const frame = character.frames[index];
        const height = 355;
        const scale = height / character.bodyHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, 412);
        ctx.scale(facing, 1);
        ctx.drawImage(image, frame.minX, frame.minY, frame.maxX-frame.minX+1, frame.maxY-frame.minY+1,
          -(frame.maxX-frame.minX+1)*scale/2,
          index === 4 ? -height : -(frame.maxY-frame.minY+1)*scale,
          (frame.maxX-frame.minX+1)*scale, (frame.maxY-frame.minY+1)*scale);
        ctx.restore();
      }
      document.getElementById("pose").onchange = () => actors.forEach(paint);
      document.getElementById("facing").onclick = () => { facing *= -1; actors.forEach(paint); };
    </script>
  </body>
</html>
