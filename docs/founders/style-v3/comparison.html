function load(src){if(!cache.has(src))cache.set(src,new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Could not load '+src));img.src=src}));return cache.get(src)}
function draw(canvas,asset,image,index,height,feet){const ctx=canvas.getContext('2d'),b=asset.frames[index],w=b.maxX-b.minX+1,h=b.maxY-b.minY+1,scale=height/asset.bodyHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.save();ctx.translate(canvas.width/2,feet);ctx.scale(facing,1);ctx.drawImage(image,b.minX,b.minY,w,h,(b.minX-(index%4)*asset.width/4-asset.width/8)*scale,index===4?-height:-h*scale,w*scale,h*scale);ctx.restore()}
async function paint(){await Promise.all(actors.map(async a=>{const asset=a.character[mode];draw(a.canvas,asset,await load(asset.image),pose,300,343);a.mark.textContent=mode==='after'?'Revised · v3':'Original · v2'}));await Promise.all(data.references.map(async(r,i)=>draw(document.querySelectorAll('.references canvas')[i],r,await load(r.image),pose,150,176)));document.querySelector('#status').textContent=(mode==='after'?'Revised':'Original')+' · 5 fighters · pose '+(pose+1)+' of 8';}

for(const r of data.references){const card=document.createElement('div'),canvas=document.createElement('canvas');canvas.width=180;canvas.height=180;const p=document.createElement('p');p.textContent=r.name;const span=document.createElement('span');span.textContent='Established game artwork';p.append(document.createElement('br'),span);card.append(canvas,p);document.querySelector('#references').append(card)}
for(const version of['before','after'])document.getElementById(version).onclick=()=>{mode=version;document.querySelector('#before').setAttribute('aria-pressed',mode==='before');document.querySelector('#after').setAttribute('aria-pressed',mode==='after');paint().catch(showError)};
