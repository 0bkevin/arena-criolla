function load(file){return new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src='../../'+file})}
function draw(info,im,frame,x){const b=info.components[frame],height=360,scale=height/(info.components[0].maxY-info.components[0].minY),w=b.maxX-b.minX+1,h=b.maxY-b.minY+1,slotX=frame%4*info.width/4,slotY=Math.floor(frame/4)*info.height/2;const tx=x+(b.minX-slotX-info.width/8)*scale,ty=frame===4?470-height:470-h*scale;ctx.drawImage(im,b.minX,b.minY,w,h,tx,ty,w*scale,h*scale)}
