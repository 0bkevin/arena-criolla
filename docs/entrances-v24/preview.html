<!doctype html>
<html lang="es">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Arena Criolla · Entradas v24</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #080e18;
      color: #edf3fc;
      font: 15px system-ui;
    }
    main {
      max-width: 1140px;
      margin: 32px auto;
      padding: 0 24px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 10px;
    }
    p {
      color: #aabbd0;
      line-height: 1.6;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 22px 0;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 12px;
      color: #b8c9dc;
    }
    select,
    button {
      min-height: 44px;
      background: #15263c;
      border: 1px solid #344b66;
      border-radius: 7px;
      color: #edf3fc;
      padding: 8px 12px;
      font: inherit;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      border-color: #ffdb68;
    }
    button.primary {
      background: #ffdb68;
      color: #102034;
      font-weight: 800;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #ffdb68;
    }
    select {
      width: 100%;
      min-width: 0;
    }
    figure {
      margin: 0;
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }
    figcaption {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 16px 8px;
      color: #ffdb68;
    }
    figcaption span:last-child {
      text-align: right;
    }
    .metrics {
      font: 12px monospace;
      color: #93a9c2;
      min-height: 24px;
    }
    a {
      color: #ffdb68;
    }
    @media (max-width: 600px) {
      main {
        margin: 20px auto;
        padding: 0 12px;
      }
      h1 {
        font-size: 22px;
      }
      .toolbar {
        gap: 8px;
      }
      label {
        flex: 1;
        min-width: 125px;
      }
      select {
        max-width: 100%;
      }
      figcaption {
        font-size: 12px;
      }
    }
    @media (max-width: 360px) {
      .toolbar label {
        flex-basis: 100%;
      }
    }
  </style>
  <main>
    <h1>Entradas · revisión individual</h1>
    <p>
      Cada entrada se reproduce una sola vez y termina en guardia. Óscar abre
      los brazos y da una vuelta de salsa; Dudamel abre los brazos y dirige la
      orquesta. Esta vista utiliza el renderizador real de la pelea.
    </p>
    <div class="toolbar">
      <label>Jugador 1<select id="p1"></select></label
      ><label>Jugador 2<select id="p2"></select></label
      ><button id="replay" class="primary">Reproducir entradas</button
      ><button id="pause">Pausar</button
      ><label>Movimiento reducido<input id="reduced" type="checkbox" /></label>
    </div>
    <figure>
      <canvas id="cinema" width="1080" height="640"></canvas>
      <figcaption><span id="name1"></span><span id="name2"></span></figcaption>
    </figure>
    <input
      id="scrub"
      type="range"
      min="0"
      max="359"
      value="0"
      aria-label="Recorrer cinemática"
    />
    <p class="metrics" id="metrics"></p>
    <p><a href="/">Volver al juego →</a></p>
  </main>
  <script type="module">
    import { FIGHTERS } from "/shared/content.ts";
    import { loadSprite } from "/src/game/assets.ts";
    import {
      drawIntroCinematic,
      introCamera,
    } from "/src/game/intro-renderer.ts";
    import { createMatch } from "/shared/engine.ts";
    import { CHOREOGRAPHIES } from "/shared/choreography.ts";
    import {
      INTRO_COUNTDOWN_START,
      INTRO_PLAYER_TICKS,
    } from "/shared/presentation.ts";
    const canvas = document.querySelector("#cinema"),
      ctx = canvas.getContext("2d");
    const p1 = document.querySelector("#p1"),
      p2 = document.querySelector("#p2"),
      scrub = document.querySelector("#scrub");
    for (const f of FIGHTERS) {
      p1.add(new Option(f.name, f.id));
      p2.add(new Option(f.name, f.id));
    }
    p1.value = "dudamel";
    p2.value = "oscar";
    scrub.max = INTRO_COUNTDOWN_START - 1;
    let sprites = {},
      state = null,
      start = performance.now(),
      running = true,
      paintTimes = [],
      generation = 0;
    function draw(tick) {
      if (!state) return;
      state.tick = Math.min(INTRO_COUNTDOWN_START - 1, Math.max(0, tick));
      const before = performance.now();
      drawIntroCinematic(
        ctx,
        state,
        sprites,
        document.querySelector("#reduced").checked,
      );
      paintTimes.push(performance.now() - before);
      if (paintTimes.length > 120) paintTimes.shift();
      scrub.value = state.tick;
      document.querySelector("#metrics").textContent =
        `${state.tick + 1}/${INTRO_COUNTDOWN_START} · ${(paintTimes.reduce((a, b) => a + b, 0) / paintTimes.length).toFixed(1)} ms/render · ${state.tick < INTRO_PLAYER_TICKS ? "P1" : "P2"}`;
    }
    async function choose() {
      const token = ++generation;
      const ids = [p1.value, p2.value];
      const loaded = await Promise.all(ids.map(loadSprite));
      if (token !== generation) return;
      sprites = Object.fromEntries(ids.map((id, i) => [id, loaded[i]]));
      state = createMatch(
        "caracas",
        ids.map((id) => ({ name: id, fighter: id, wins: 0 })),
      );
      document.querySelector("#name1").textContent =
        CHOREOGRAPHIES[ids[0]].name;
      document.querySelector("#name2").textContent =
        CHOREOGRAPHIES[ids[1]].name;
      start = performance.now();
      running = true;
      document.querySelector("#pause").textContent = "Pausar";
      document.querySelector("#pause").disabled = false;
      draw(0);
    }
    p1.onchange = p2.onchange = choose;
    document.querySelector("#replay").onclick = () => {
      start = performance.now();
      running = true;
      document.querySelector("#pause").textContent = "Pausar";
      document.querySelector("#pause").disabled = false;
    };
    document.querySelector("#pause").onclick = () => {
      running = !running;
      start = performance.now() - (state.tick * 1000) / 60;
      document.querySelector("#pause").textContent = running
        ? "Pausar"
        : "Continuar";
    };
    scrub.oninput = () => {
      running = false;
      draw(Number(scrub.value));
      document.querySelector("#pause").textContent = "Continuar";
      document.querySelector("#pause").disabled = false;
    };
    document.querySelector("#reduced").onchange = () => draw(state.tick);
    let previous = -Infinity;
    function loop(now) {
      if (running && now - previous > 1000 / 60) {
        const tick = Math.floor(((now - start) * 60) / 1000);
        draw(Math.min(tick, INTRO_COUNTDOWN_START - 1));
        if (tick >= INTRO_COUNTDOWN_START - 1) {
          running = false;
          document.querySelector("#pause").textContent = "Finalizado";
          document.querySelector("#pause").disabled = true;
        }
        previous = now;
      }
      requestAnimationFrame(loop);
    }
    window.entranceQA = {
      FIGHTERS,
      loadSprite,
      drawIntroCinematic,
      introCamera,
      createMatch,
      CHOREOGRAPHIES,
      choose,
      draw,
      get state() {
        return state;
      },
      get sprites() {
        return sprites;
      },
      stop() {
        running = false;
      },
      get timings() {
        return paintTimes;
      },
    };
    await choose();
    requestAnimationFrame(loop);
  </script>
</html>
