name: Check production promotion
on:
  # Dispatched on main by promote.yml: PRs created with GITHUB_TOKEN do not
  # trigger pull_request workflows. main's own CI run provides validate.
  workflow_dispatch:
    inputs:
      promotion-pr:
        description: Promotion PR to check
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: arena-promotion-${{ inputs.promotion-pr }}
  cancel-in-progress: true
jobs:
  prod-source:
    if: github.repository == '0bkevin/arena-criolla'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # API-only: no source from the promotion PR is executed with this token.
      - name: Require promotion from this repository's main branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ inputs.promotion-pr }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PROMOTION_PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PROMOTION_PR" > "$RUNNER_TEMP/promotion.json"
          python3 - "$RUNNER_TEMP/promotion.json" <<'PY'
          import json, os, sys
          pr = json.load(open(sys.argv[1]))
          assert pr['state'] == 'open'
          assert pr['base']['ref'] == 'prod'
          assert pr['head']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['sha'] == os.environ['EXPECTED_SHA']
          PY
