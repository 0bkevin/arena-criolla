name: Deploy production
on:
  push:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: arena-production-deployment
  cancel-in-progress: false
jobs:
  # Tests already ran on each PR and on the promotion PR; only the image is new here.
  image:
    if: github.repository == '0bkevin/arena-criolla' && github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/image.yml
    with:
      scan: true
      export: true
  deploy:
    if: github.repository == '0bkevin/arena-criolla' && github.ref == 'refs/heads/prod'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://arenacriolla.com
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify image integrity and current prod head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check image.tar.gz.sha256
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
      - name: Deliver the verified image to the restricted host installer
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          checksum=$(sha256sum image.tar.gz | cut -d' ' -f1)
          ssh -F /dev/null -T -p "$DEPLOY_PORT" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $checksum" < image.tar.gz
          echo "Installed production commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
