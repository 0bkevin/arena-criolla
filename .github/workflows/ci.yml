name: Validate Arena Criolla
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      promotion-pr:
        description: Promotion PR to validate (set by the promotion workflow)
        type: string
        required: false
  workflow_call:
permissions:
  contents: read
concurrency:
  group: arena-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit all locked dependencies
        if: matrix.shard == 1
        run: npm audit --audit-level=low
      - name: Run test shard ${{ matrix.shard }} of 2
        run: node --import tsx --test --test-shard=${{ matrix.shard }}/2 tests/*.test.ts tests/character-audits/*.test.ts
      - run: npm run check:assets
        if: matrix.shard == 2
      # The production job builds the client. This also checks test-only types.
      - run: npm run typecheck
        if: matrix.shard == 1
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate production delivery controls
        run: |
          python3 -B deploy/test_install_release.py
          bash -n deploy/receive-release deploy/install-delivery-controls.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          pull: true
          load: true
          tags: |
            arena-criolla:ci
            arena-criolla:release-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=arena-criolla-ci
          cache-to: type=gha,scope=arena-criolla-ci,mode=max
      - name: Set vulnerability cache period
        id: scanner-cache
        run: echo "period=$(( $(date +%s) / 21600 ))" >> "$GITHUB_OUTPUT"
      - name: Cache vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-0.76.0-${{ steps.scanner-cache.outputs.period }}
          restore-keys: ${{ runner.os }}-trivy-0.76.0-
      - name: Check the complete runtime image for known CVEs
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          trap 'rm -rf "$scanner_dir"' EXIT
          curl --fail --location --retry 3 --output "$scanner_dir/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          echo "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7  $scanner_dir/trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$scanner_dir/trivy.tar.gz" --directory "$scanner_dir" trivy
          "$scanner_dir/trivy" image --disable-telemetry --scanners vuln --exit-code 1 arena-criolla:ci
      - name: Boot production image and verify HTTP and WebSocket behavior
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --publish 127.0.0.1::5173 arena-criolla:ci)
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          port=$(docker port "$container" 5173/tcp | cut -d: -f2)
          base="http://127.0.0.1:$port"
          # Docker can reset connections before the application is listening.
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 2 --max-time 3 "$base/api/health"
          # Use the dependencies in the image instead of installing them again.
          docker exec -i "$container" node --input-type=module - http://127.0.0.1:5173 < scripts/security-smoke.mjs
      - name: Export the verified production image
        if: github.repository == '0bkevin/arena-criolla' && github.ref == 'refs/heads/prod'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "arena-criolla:release-$RELEASE_SHA" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.repository == '0bkevin/arena-criolla' && github.ref == 'refs/heads/prod'
        with:
          name: production-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/image.tar.gz
            ${{ runner.temp }}/image.tar.gz.sha256
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  # Keep the existing required check name and propagate either job's failure.
  validate:
    if: always()
    needs: [tests, production]
    runs-on: ubuntu-latest
    steps:
      - name: Require tests and production checks
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: test "$TEST_RESULT" = success && test "$PRODUCTION_RESULT" = success
  prod-source:
    name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'prod' || github.event_name == 'workflow_dispatch' && inputs.promotion-pr != '') && 'prod-source' || 'prod-source-not-required' }}
    if: >-
      github.repository == '0bkevin/arena-criolla' &&
      (github.event_name == 'pull_request' && github.base_ref == 'prod' ||
       github.event_name == 'workflow_dispatch' && inputs.promotion-pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # API-only: no source from the promotion PR is executed with this token.
      - name: Require promotion from this repository's main branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ github.event.pull_request.number || inputs.promotion-pr }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PROMOTION_PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PROMOTION_PR" > "$RUNNER_TEMP/promotion.json"
          python3 - "$RUNNER_TEMP/promotion.json" <<'PY'
          import json, os, sys
          pr = json.load(open(sys.argv[1]))
          assert pr['state'] == 'open'
          assert pr['base']['ref'] == 'prod'
          assert pr['head']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['sha'] == os.environ['EXPECTED_SHA']
          PY
