name: Validate Arena Criolla
on:
  pull_request:
  workflow_dispatch:
    inputs:
      promotion-pr:
        description: Promotion PR to validate (set by the promotion workflow). Leave empty to run every check.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # A promotion PR is validated by both its pull_request event and the dispatch; keep one.
  group: arena-ci-${{ github.event.pull_request.number || inputs.promotion-pr || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      typecheck: ${{ steps.select.outputs.typecheck }}
      assets: ${{ steps.select.outputs.assets }}
      audit: ${{ steps.select.outputs.audit }}
      deploy-controls: ${{ steps.select.outputs.deploy-controls }}
      image: ${{ steps.select.outputs.image }}
      scan: ${{ steps.select.outputs.scan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select checks for the changed files
        id: select
        env:
          # PRs compare against their base; a promotion compares main against prod.
          BASE: ${{ github.event.pull_request.base.sha || (inputs.promotion-pr && 'origin/prod') || '' }}
        run: node scripts/select-checks.mjs $BASE
  checks:
    needs: plan
    if: >-
      needs.plan.outputs.tests != '' || needs.plan.outputs.typecheck == 'true' ||
      needs.plan.outputs.assets == 'true' || needs.plan.outputs.audit == 'true' ||
      needs.plan.outputs.deploy-controls == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_WORK: ${{ needs.plan.outputs.tests != '' || needs.plan.outputs.typecheck == 'true' || needs.plan.outputs.assets == 'true' || needs.plan.outputs.audit == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.NODE_WORK == 'true'
        with:
          node-version: 24
          cache: npm
      - if: env.NODE_WORK == 'true'
        run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies
        if: needs.plan.outputs.audit == 'true'
        run: npm audit --audit-level=low
      - name: Run affected tests
        if: needs.plan.outputs.tests != ''
        env:
          TESTS: ${{ needs.plan.outputs.tests }}
        run: node --import tsx --test $TESTS
      - if: needs.plan.outputs.typecheck == 'true'
        run: npm run typecheck
      - if: needs.plan.outputs.assets == 'true'
        run: npm run check:assets
      - name: Validate production delivery controls
        if: needs.plan.outputs.deploy-controls == 'true'
        run: |
          python3 -B deploy/test_install_release.py
          bash -n deploy/receive-release deploy/install-delivery-controls.sh
  # Builds and smoke-tests the image for changes to what it ships. Promotions skip
  # it: deploying from prod builds, scans and smoke-tests the image it delivers.
  image:
    needs: plan
    if: needs.plan.outputs.image == 'true' && github.base_ref != 'prod' && !inputs.promotion-pr
    uses: ./.github/workflows/image.yml
    with:
      scan: ${{ needs.plan.outputs.scan == 'true' }}
  # The required check: fails unless planning succeeded and nothing selected failed.
  validate:
    if: always()
    needs: [plan, checks, image]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          test "$PLAN" = success
          [[ "$CHECKS" =~ ^(success|skipped)$ ]]
          [[ "$IMAGE" =~ ^(success|skipped)$ ]]
  prod-source:
    name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'prod' || github.event_name == 'workflow_dispatch' && inputs.promotion-pr != '') && 'prod-source' || 'prod-source-not-required' }}
    if: >-
      github.repository == '0bkevin/arena-criolla' &&
      (github.event_name == 'pull_request' && github.base_ref == 'prod' ||
       github.event_name == 'workflow_dispatch' && inputs.promotion-pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # API-only: no source from the promotion PR is executed with this token.
      - name: Require promotion from this repository's main branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR: ${{ github.event.pull_request.number || inputs.promotion-pr }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$PROMOTION_PR" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PROMOTION_PR" > "$RUNNER_TEMP/promotion.json"
          python3 - "$RUNNER_TEMP/promotion.json" <<'PY'
          import json, os, sys
          pr = json.load(open(sys.argv[1]))
          assert pr['state'] == 'open'
          assert pr['base']['ref'] == 'prod'
          assert pr['head']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert pr['head']['sha'] == os.environ['EXPECTED_SHA']
          PY
