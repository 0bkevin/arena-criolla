name: Validate Arena Criolla
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:assets
      - run: npm run build
      - name: Build production image
        run: docker build -t arena-criolla:ci .
      - name: Boot production image and verify HTTP routes
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker run --detach --publish 127.0.0.1::5173 arena-criolla:ci)
          trap 'docker logs "$container"; docker rm --force --volumes "$container"' EXIT
          port=$(docker port "$container" 5173/tcp | cut -d: -f2)
          base="http://127.0.0.1:$port"
          # Docker can reset connections before the application is listening.
          curl --fail --retry 15 --retry-delay 1 --retry-all-errors --retry-max-time 30 --connect-timeout 2 --max-time 3 "$base/api/health"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/create")" = 302
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/creator/capabilities")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/auth/session")" = 404
