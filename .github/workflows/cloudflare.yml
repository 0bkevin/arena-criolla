name: Deploy Cloudflare
on:
  push:
    branches: [cloudflare-prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-cloudflare-deployment
  cancel-in-progress: false
jobs:
  # Tests are not repeated: cloudflare-prod must hold a tree that passed CI on main.
  green-main:
    if: github.repository == '0bkevin/arena-criolla' && github.ref == 'refs/heads/cloudflare-prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the code that passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tested-tree-$tree" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length')
          if [ "$passed" -eq 0 ]; then
            echo "::error::cloudflare-prod's code ($tree) never passed CI. Push only a green main."
            exit 1
          fi
  deploy:
    needs: green-main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare
      url: ${{ vars.CLOUDFLARE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the Worker and its static assets
        run: npm run cf:build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --message "cloudflare-prod $GITHUB_SHA"
          echo "Deployed cloudflare-prod commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the deployment
        if: vars.CLOUDFLARE_URL != ''
        env:
          CLOUDFLARE_URL: ${{ vars.CLOUDFLARE_URL }}
        run: node scripts/cloudflare/smoke.mjs "$CLOUDFLARE_URL"
